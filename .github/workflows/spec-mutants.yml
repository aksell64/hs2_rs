name: Spec mutants

on:
  workflow_dispatch:
    inputs:
      samples:
        description: Traces per simulation mutant
        default: "300"
      max_steps:
        description: Steps per trace
        default: "300"

jobs:
  mutants:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/spec/quint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install -g @informalsystems/quint@0.32.0
      - run: make mutants MUTANT_SAMPLES=${{ inputs.samples }} MUTANT_MAX_STEPS=${{ inputs.max_steps }}
