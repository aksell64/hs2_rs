name: Spec simulation

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model from models.qnt
        default: n4f1v20
      max_steps:
        description: Steps per trace
        default: "1000"
      samples:
        description: Number of traces
        default: "1"
      seed:
        description: Seed to reproduce a run (empty for random)
        default: ""

jobs:
  sim:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/spec/quint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install -g @informalsystems/quint@0.32.0
      - run: make sim STEP=step_fair MODEL=${{ inputs.model }} MAX_STEPS=${{ inputs.max_steps }} SAMPLES=${{ inputs.samples }} SEED=${{ inputs.seed }}
      - if: always() && hashFiles('docs/spec/quint/trace.itf.json') != ''
        run: make analyze
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation
          path: |
            docs/spec/quint/trace.itf.json
            docs/spec/quint/analisys.md
          if-no-files-found: ignore
