[package]
name = "hotstuff-consensus"
description = "Chained HotStuff-2: blocks, quorum certificates, messages and replica state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[features]
testing = []

[dependencies]
hotstuff-types.workspace = true
hotstuff-crypto.workspace = true
codec = { package = "parity-scale-codec", version = "3.0", default-features = false, features = ["derive"],  bytes = "1" }
bytes = "1.12.1"
tokio = { version = "1.53.2", features = ["macros", "time", "sync"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt", "macros"] }

