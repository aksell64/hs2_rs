old = '''c.voted_view < view and block.justify.view >= c.qc_lock.view'''
new = '''c.voted_view < view and (block.justify.view >= c.qc_lock.view or is_byzantine(c.id))'''

[[entry.changes]]
file = "consensus.qnt"
old = '''consensus: c.with("voted_view", cur_view),'''
new = '''consensus: c.with("voted_view", cur_view)
          .with("deviations", c.deviations + (if (block.justify.view < c.qc_lock.view) 1 else 0)),'''

