# Entries for tools/mutants.py.
#
# changes:   each `old` must occur exactly once in `file` and is replaced with `new`.
# byzantine: if set, the mutation applies only to these nodes; otherwise to every node.
#            The new code calls is_byzantine(id) and increments the ghost counter c.deviations whenever
#            a Byzantine node acts differently from a correct one. The script defines is_byzantine in
#            types.qnt, adds `deviations` to Consensus, a witness in main.qnt and a model instance with
#            FAULTY = Set() and BYZANTINE = these nodes (committee_size, max_view).
# expect:    "violation" (the check must find one) or "safe" (it must not).
# check:     `test` (a run from scenarios_test.qnt), or `invariant` + `step` (+ `model` without `byzantine`).
# witnesses: extra witnesses from main.qnt to report for a simulation (in how many traces each held).

